[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emo-rec"
version = "0.1.0"
description = "Cross-subject EEG emotion recognition experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "pandas>=2.1,<3",
    "matplotlib>=3.8,<4",
    "openpyxl>=3.1,<4",
    "h5py>=3.10,<4",
    "torch>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
